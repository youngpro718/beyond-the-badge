<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Beyond the Badge</title>
<meta name="description" content="A moment of thanks for the people and moments that make a difference.">
<meta name="theme-color" content="#1f2a4a">
<meta property="og:type" content="website">
<meta property="og:title" content="Beyond the Badge">
<meta property="og:description" content="A moment of thanks for the people and moments that make a difference.">
<meta property="og:image" content="https://youngpro718.github.io/beyond-the-badge/assets/share.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 2c6 4 15 5 24 2l6 6c-4 8-3 17 1 23-1 15-12 24-31 29C13 57 2 48 1 33c4-6 5-15 1-23l6-6c9 3 18 2 24-2z' fill='%23b8862f'/%3E%3Cpath d='M32 18l4 9 10 1-7 7 2 10-9-5-9 5 2-10-7-7 10-1z' fill='%231f2a4a'/%3E%3C/svg%3E">
<style>
/* Colors come from the theme in themes.js; these are only the starting values. */
:root{
  --bg1:#f8e6c9;--bg2:#e9b98a;--card:#fffaf2;--ink:#3a2a1c;--heading:#6b3415;--accent:#c4622d;--soft:#fbecd8;--field:#e2c9a8;--button:#7a3a17;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --radius:20px;--shadow:0 6px 22px rgba(40,25,10,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.5 var(--sans);background:var(--bg1);overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit}
[hidden]{display:none!important}

/* ---- background ---- */
.sky{position:fixed;inset:0;z-index:-2;background:linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 100%)}
#decor{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.flake{position:absolute;top:-70px;left:var(--x);font-size:var(--size);opacity:.85;animation:fall var(--dur) linear var(--delay) infinite;will-change:transform}
@keyframes fall{to{transform:translate3d(var(--drift),118vh,0) rotate(var(--spin))}}
#decor.still .flake{animation:none;top:var(--top);opacity:.28}

/* ---- layout ---- */
main{max-width:620px;margin:0 auto;padding:24px 16px 200px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}
.card + .card,.card + form,.signed + form{margin-top:16px}

/* ---- header ---- */
.hero{position:relative;overflow:hidden;text-align:center;padding:32px 24px 28px;box-shadow:0 10px 34px rgba(40,25,10,.12)}
.hero::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:var(--accent)}
.hero-art{display:block;height:170px;width:auto;margin:0 auto 8px;transform-origin:50% 100%;animation:rise .8s cubic-bezier(.2,1.2,.4,1) both,sway 4s ease-in-out .8s infinite}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.9)}to{opacity:1;transform:none}}
@keyframes sway{50%{transform:rotate(1.5deg) translateY(-2px)}}
.hero-art{max-width:100%;object-fit:contain}
.hero-art.logo{height:auto;max-height:150px;animation:rise .8s cubic-bezier(.2,1.2,.4,1) both}
.hero-decor{font-size:30px;letter-spacing:10px;line-height:1;margin-bottom:12px}
.hero-decor:empty{display:none}
.eyebrow{font:700 12px/1 var(--sans);letter-spacing:.2em;color:var(--accent);text-transform:uppercase}
.eyebrow:empty{display:none}
h1{font:700 clamp(36px,10vw,56px)/1.05 var(--serif);margin:12px 0;color:var(--heading)}
.subtitle{margin:0 auto;max-width:30em;font-size:17px;opacity:.85}
.subtitle:empty{display:none}
.countdown{display:inline-block;margin-top:16px;padding:8px 16px;border-radius:999px;background:var(--soft);color:var(--heading);font:700 14px/1.3 var(--sans)}
.countdown:empty{display:none}

/* ---- sign in ---- */
h2{font:700 22px/1.25 var(--serif);color:var(--heading);margin:0 0 4px}
.lead{margin:0 0 16px;opacity:.8}
.field-label{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
.field-label + input{margin-bottom:16px}
.optional{font-weight:400;opacity:.65}
#signinForm .error{margin:-8px 0 12px}
.signed{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px;font-size:14px}
.signed .chip{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow)}
.signed .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.link-btn{background:none;border:0;padding:4px;color:var(--heading);text-decoration:underline;cursor:pointer;font-size:14px}

/* ---- questions ---- */
.note{text-align:center;margin:0 8px 16px;font-size:15px;opacity:.8}
.note:empty{display:none}
.q{background:var(--card);border-radius:var(--radius);padding:20px;margin:12px 0;box-shadow:var(--shadow);transition:transform .35s,box-shadow .35s}
.q.current{transform:scale(1.015);box-shadow:0 12px 30px rgba(40,25,10,.14)}
.q > label{display:flex;gap:12px;align-items:flex-start;font:700 19px/1.35 var(--serif);margin-bottom:12px;color:var(--heading)}
.num{flex:0 0 28px;height:28px;margin-top:1px;border-radius:50%;background:var(--accent);color:#fff;font:700 14px/28px var(--sans);text-align:center}
textarea,input{width:100%;font:16px/1.4 var(--sans);color:var(--ink);border:1.5px solid var(--field);border-radius:12px;padding:12px 14px;background:#fff;transition:border-color .2s,box-shadow .2s}
textarea{min-height:110px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
input[aria-invalid="true"]{border-color:#b3261e}
.btn{padding:14px 20px;background:var(--button);color:#fff;font-weight:700;font-size:16px;border:0;border-radius:12px;cursor:pointer;transition:filter .2s,transform .1s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.6;cursor:default}
.btn.wide{width:100%;padding:16px}
.btn.quiet{background:var(--soft);color:var(--heading)}
.message{margin:12px 4px 0;font-size:15px;text-align:center}
.message:empty{display:none}
.error{color:#b3261e;font-size:14px}
.error:empty{display:none}

/* ---- chase scenes between questions ---- */
.lane{position:relative;height:128px;overflow:hidden;margin:0 -16px}
.lane.divider{display:flex;align-items:center;justify-content:center;gap:18px;height:56px;font-size:22px;opacity:.55}
.lane.rule{height:24px}
.actor{position:absolute;left:0;bottom:6px;will-change:transform}
.actor.fly{bottom:38px}
.actor .flip{transform:scaleX(var(--dir,1));transform-origin:50% 100%}
.actor .body{display:block;transform-origin:50% 100%}
.actor img{display:block;width:auto}
.actor.fly .body{animation:float 1.1s ease-in-out infinite alternate}
.actor .body.bounce{animation:bounce .38s ease-out}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-12px)}}
@keyframes bounce{40%{transform:translateY(-22px)}100%{transform:none}}
.actor .dust{position:absolute;left:-10px;bottom:0;font-size:18px;opacity:0;animation:dust .55s ease-out forwards}
@keyframes dust{from{opacity:.75;transform:scale(.6)}to{opacity:0;transform:translate(-26px,-10px) scale(1.5)}}

/* ---- after submitting ---- */
.finale{text-align:center;margin-top:16px}
.notice{text-align:center;margin-top:16px}
.notice .lead{margin:0}
.finale .cast{display:flex;align-items:flex-end;justify-content:center;gap:4px;margin-bottom:12px}
.finale .cast img{width:auto}
.finale p{font:700 20px/1.35 var(--serif);color:var(--heading);margin:0 0 16px}

/* ---- footer ---- */
.foot{text-align:center;margin-top:32px;font-size:13px}
.foot a{color:var(--ink);opacity:.55;text-decoration:none}
.foot a:hover{opacity:.9;text-decoration:underline}

/* ---- guide ---- */
.guide{--gk:.5;position:fixed;left:12px;bottom:12px;z-index:30;display:flex;align-items:flex-end;gap:8px;max-width:calc(100% - 24px);transition:transform .35s ease}
.guide-figure{flex:0 0 auto;background:none;border:0;padding:0;cursor:pointer;border-radius:12px}
.guide-figure:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.guide-figure img{display:block;width:auto;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18));transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.015) translateY(-1px)}}
.guide-figure img.hop{animation:hop .5s ease}
@keyframes hop{30%{transform:translateY(-14px) scale(.97,1.05)}60%{transform:translateY(0) scale(1.04,.95)}100%{transform:none}}
.guide-figure img.jump{animation:jump .7s ease}
@keyframes jump{25%{transform:translateY(-26px) rotate(-8deg)}50%{transform:translateY(-26px) rotate(8deg)}80%{transform:translateY(0) scale(1.06,.92)}100%{transform:none}}
.bubble{position:relative;margin-bottom:80px;max-width:230px;background:#fff;color:var(--ink);border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.bubble.say{animation:say .3s ease}
@keyframes say{from{transform:scale(.92)}to{transform:none}}
.bubble::after{content:"";position:absolute;left:-7px;bottom:16px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.choose{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.choose button{flex:1 1 40%;padding:8px 10px;border:1.5px solid var(--field);background:#fff;color:var(--heading);border-radius:10px;font-weight:600;font-size:13px;cursor:pointer}
.guide.enter{animation:enter .55s cubic-bezier(.26,1.4,.4,1) both}
@keyframes enter{from{opacity:0;transform:translateY(40px) scale(.8)}to{opacity:1;transform:none}}

/* Phones: the guide is a slim bar docked at the bottom, the character peeking over it */
@media (max-width:699px){
  main{padding-bottom:130px}
  .hero-art{height:140px}
  .card{padding:20px}
  .guide{--gk:.27;left:0;right:0;bottom:0;max-width:none;align-items:center;gap:10px;padding:8px 14px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.14)}
  .guide-figure{margin-top:-44px}
  .bubble{flex:1;margin:0;max-width:none;background:var(--soft);box-shadow:none;padding:10px 12px}
  .bubble::after{border-right-color:var(--soft)}
  .guide.typing{transform:translateY(calc(100% + 60px))}   /* fully out of sight, character included */
}
/* Wide screens: the guide stands beside the questions */
@media (min-width:1000px){.guide{--gk:.55;left:calc(50% - 310px - 260px);bottom:40px}.bubble{max-width:200px;margin-bottom:110px}}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .flake{animation:none!important;top:var(--top)!important;opacity:.28}
  .guide-figure img,.actor *,.guide,.bubble,.hero-art{animation:none!important}
  .q{transition:none}
}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
/* ---- poster themes (Courthouse Superlatives): the vintage flyer look ---- */
body.poster{--display:"Bangers",Impact,"Arial Black",sans-serif;--type:"Special Elite","Courier New",monospace}
body.poster .sky{background:radial-gradient(ellipse at 50% 40%,var(--bg1) 0%,var(--bg1) 45%,var(--bg2) 100%)}
body.poster .card,body.poster .q{border-radius:10px;border:2px solid rgba(70,40,15,.45);box-shadow:inset 0 0 36px rgba(140,90,30,.16),0 6px 20px rgba(60,30,10,.14)}
body.poster .hero{padding-top:0}
body.poster .hero::before{display:none}
body.poster .hero-art.wide{display:block;width:calc(100% + 48px);max-width:none;height:auto;margin:0 -24px 18px;border-bottom:3px solid rgba(70,40,15,.6);animation:none}
body.poster h1{font:400 clamp(44px,13vw,72px)/.95 var(--display);letter-spacing:.02em;text-transform:uppercase;color:var(--heading);text-shadow:3px 3px 0 #1f2a4a}
body.poster .eyebrow{color:#1f2a4a}
body.poster .subtitle{display:inline-block;margin-top:4px;padding:6px 18px;font:17px/1.35 var(--type);background:var(--soft);border:2px solid rgba(70,40,15,.55);transform:rotate(-1.5deg);opacity:1}
body.poster .note,body.poster .lead{font-family:var(--type);opacity:1}
body.poster .note{font-size:18px;color:var(--ink)}
body.poster h2,body.poster .finale p,body.poster .notice h2{font-family:var(--display);font-weight:400;letter-spacing:.03em;font-size:26px;text-transform:uppercase}
body.poster .q > label{font:400 18px/1.35 var(--type);color:var(--ink)}
body.poster .num{flex-basis:32px;height:32px;margin-top:-3px;border-radius:0;background:var(--accent);color:#1f2a4a;font:400 15px/34px var(--display);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
body.poster textarea,body.poster input{background:#fffaf0;border-color:var(--field)}
body.poster .btn{text-transform:uppercase;letter-spacing:.06em}
.preview-flag{position:fixed;inset:0 0 auto;z-index:40;background:#1f2329;color:#fff;font:700 11px/1 var(--sans);letter-spacing:.12em;text-align:center;padding:6px}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<div id="decor" aria-hidden="true"></div>

<main>
  <noscript><div class="card" style="margin-bottom:16px;text-align:center">This page needs JavaScript turned on to work.</div></noscript>
  <header class="card hero">
    <div id="heroArt" aria-hidden="true"></div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
    <div class="countdown" id="countdown"></div>
  </header>

  <section class="card q" id="signin" data-step="hello" aria-labelledby="signinTitle">
    <h2 id="signinTitle">Sign in</h2>
    <p class="lead" id="signInText"></p>
    <form id="signinForm" novalidate>
      <label class="field-label" for="who">Your name</label>
      <input id="who" maxlength="120" autocomplete="name" placeholder="First and last name" required>
      <label class="field-label" for="whoEmail">Email <span class="optional">(optional)</span></label>
      <input id="whoEmail" type="email" maxlength="200" autocomplete="email" inputmode="email" placeholder="name@example.com">
      <p class="error" id="whoError" role="alert"></p>
      <button type="submit" class="btn wide">Continue</button>
    </form>
  </section>

  <section class="card notice" id="notice" hidden aria-live="polite">
    <h2 id="noticeTitle"></h2>
    <p class="lead" id="noticeText"></p>
  </section>

  <div class="signed" id="signed" hidden>
    <span class="chip"><span class="dot" aria-hidden="true"></span>Signed in as <strong id="whoName"></strong></span>
    <button type="button" class="link-btn" id="notYou">Not you?</button>
  </div>

  <form id="form" hidden>
    <p class="note" id="intro"></p>
    <div id="questions"></div>
    <div class="hp" aria-hidden="true"><label>Leave this empty <input id="website" tabindex="-1" autocomplete="off"></label></div>
    <section class="q" data-step="ready">
      <button type="submit" class="btn wide" id="submitBtn"></button>
      <p class="message" id="message" role="status" aria-live="polite"></p>
    </section>
  </form>

  <section class="card finale" id="finale" hidden aria-live="polite">
    <div class="cast" id="finaleCast" aria-hidden="true"></div>
    <p id="thanksText"></p>
    <button type="button" class="btn quiet" id="again">Share more thanks</button>
  </section>

  <footer class="foot"><a href="settings.html" id="organizer">Organizer settings</a></footer>
</main>

<aside class="guide" id="guide" hidden>
  <button type="button" class="guide-figure" id="guideFigure" aria-label="Say hi to your event guide"><img id="guideImg" alt=""></button>
  <div class="bubble" id="bubble" aria-live="polite"></div>
</aside>

<script src="config.js?v=8"></script>
<script src="themes.js?v=11"></script>
<script>
const SUPABASE = SUPABASE_URL + '/rest/v1/', KEY = SUPABASE_KEY;
const S = readSettings(location.search);
const theme = resolveTheme(S.theme);
const runner = theme.runner;
const $ = sel => document.querySelector(sel);
const wait = ms => new Promise(r => setTimeout(r, ms));
const pick = list => list[Math.floor(Math.random() * list.length)];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const touch = matchMedia('(pointer: coarse)').matches;
const focusFirst = () => { if (!touch) $('#a0').focus({ preventScroll: true }); };
const mascotKeys = Object.keys(MASCOTS);

// Every drawing's height, so characters keep the same size from frame to frame.
const frameHeight = {};
function loadFrames(list) {
  return Promise.all([...new Set(list)].map(src => new Promise(res => {
    if (frameHeight[src]) return res();
    const img = new Image();
    img.onload = () => { frameHeight[src] = img.naturalHeight; res(); };
    img.onerror = res;
    img.src = src;
  })));
}

// =====================================================================
// Look: colors, words, header art, background
// =====================================================================
const css = document.documentElement.style;
for (const k of ['bg1', 'bg2', 'card', 'ink', 'heading', 'accent', 'soft', 'field', 'button']) css.setProperty('--' + k, theme[k]);
if (S.bgColor) { css.setProperty('--bg1', S.bgColor); css.setProperty('--bg2', S.bgColor); }
if (S.accent) css.setProperty('--accent', S.accent);

if (theme.style === 'poster') {
  document.body.classList.add('poster');
  document.head.insertAdjacentHTML('beforeend', '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Special+Elite&display=swap">');
}
const title = S.title || theme.headline;
$('#title').textContent = title;
$('#eyebrow').textContent = S.eyebrow;
$('#subtitle').textContent = S.subtitle;
$('#signInText').textContent = S.signIn;
$('#intro').textContent = S.intro;
$('#submitBtn').textContent = S.button;
document.title = S.eyebrow ? `${title} · ${S.eyebrow}` : title;
// the picture above the title (settings: theme's, a guide, an uploaded logo, or none)
const heroPic = heroSrc(S, theme);
function heroDecor() { $('#heroArt').className = 'hero-decor'; $('#heroArt').textContent = S.heroImage === 'none' ? '' : theme.decor.slice(0, 3).join(' '); }
if (heroPic) {
  const img = new Image();
  // a poster theme's own picture runs across the top of the header, like the flyer
  img.className = 'hero-art' + (S.heroImage.startsWith('u:') ? ' logo' : theme.style === 'poster' && heroPic === theme.hero ? ' wide' : '');
  img.alt = '';
  img.onerror = () => { img.remove(); heroDecor(); };   // a deleted upload: fall back quietly
  img.src = heroPic;
  $('#heroArt').appendChild(img);
} else heroDecor();
if (S.preview) {
  document.body.insertAdjacentHTML('afterbegin', '<div class="preview-flag">PREVIEW — RESPONSES ARE NOT SENT</div>');
  $('#organizer').hidden = true;
}

function sprinkle(count, oneShot) {
  const box = $('#decor');
  for (let i = 0; i < count; i++) {
    const el = document.createElement('span');
    el.className = 'flake';
    el.textContent = theme.decor[i % theme.decor.length];
    const v = {
      '--x': Math.random() * 100 + 'vw', '--top': Math.random() * 95 + 'vh',
      '--size': 18 + Math.random() * 22 + 'px',
      '--dur': (oneShot ? 2.5 + Math.random() * 2 : 10 + Math.random() * 10) + 's',
      '--delay': (oneShot ? Math.random() * .6 : -Math.random() * 20) + 's',
      '--drift': (Math.random() - .5) * 180 + 'px', '--spin': (Math.random() - .5) * 720 + 'deg',
    };
    for (const [k, val] of Object.entries(v)) el.style.setProperty(k, val);
    if (oneShot) { el.style.animationIterationCount = 1; setTimeout(() => el.remove(), 5500); }
    box.appendChild(el);
  }
}
if (S.background !== 'plain' && theme.decor.length) {
  if (S.background === 'still') $('#decor').classList.add('still');
  sprinkle(18, false);
}

// =====================================================================
// Questions: built from the settings, with a chase lane in up to three gaps
// =====================================================================
const questions = S.questions;
const box = $('#questions');
const lanesWanted = Math.min(3, questions.length - 1);
const laneAfter = new Set(Array.from({ length: lanesWanted }, (_, k) => Math.round((k + 1) * questions.length / (lanesWanted + 1)) - 1));
questions.forEach((text, i) => {
  const sec = document.createElement('section');
  sec.className = 'q';
  sec.dataset.step = 'q' + i;
  sec.innerHTML = `<label for="a${i}"><span class="num">${i + 1}</span><span></span></label><textarea id="a${i}" maxlength="3000"></textarea>`;
  sec.querySelector('label span:last-child').textContent = text;
  box.appendChild(sec);
  if (laneAfter.has(i)) box.insertAdjacentHTML('beforeend', '<div class="lane" aria-hidden="true"></div>');
});

// =====================================================================
// Guide: rides along, changes drawing and line for each question
// =====================================================================
const guideEl = $('#guide'), guideImg = $('#guideImg'), bubble = $('#bubble');
const LINES = {
  hello: 'Hi! Start by signing in with your name.',
  // the thank-you lines fit the original questions; anything else gets lines that fit any question
  q: sameQuestions(S.questions, QUESTIONS)
    ? ['Someone deserves a little appreciation!', 'Those little moments make a big difference.', 'A great team makes all the difference.', 'What are you looking forward to?']
    : ['Who comes to mind first?', 'Great pick!', 'Take your time.', 'Keep them coming!', 'You’re doing great.', 'Almost there!', 'Nearly done!', 'Last one, you’ve got this.'],
  ready: 'All set? Tap the button when you’re ready.',
  done: 'Thank you for sharing!',
  tap: ['Hey, that tickles!', 'Still on duty!', 'Order in the court!', 'Keep going, you’re doing great.'],
  chase: runner ? [`There goes the ${runner.name}!`, `Catch that ${runner.name}!`, `Not the ${runner.name} again…`] : [],
};
let guide = S.mascot === 'none' ? null : MASCOTS[S.mascot] ? S.mascot : pick(mascotKeys);
let step = 'hello';
let asideTimer;

function replay(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function draw(src) {
  guideImg.src = src;
  guideImg.style.height = `calc(${frameHeight[src] || 270}px * var(--gk))`;
}
function say(text) { bubble.textContent = text; if (!reduceMotion) replay(bubble, 'say'); }
function show(name) {
  if (!guide) return;
  step = name;
  const g = MASCOTS[guide].guide;
  if (name.startsWith('q')) {
    const i = +name.slice(1), last = i === questions.length - 1 && !sameQuestions(questions, QUESTIONS);
    draw(g.q[i % g.q.length]);
    say(last ? 'Last one, you’ve got this.' : LINES.q[i % LINES.q.length]);
  }
  else { draw(g[name]); say(LINES[name]); }
  if (!reduceMotion) replay(guideImg, 'hop');
}
// a quick reaction that goes back to the current step afterward
function aside(src, text, cls) {
  if (!guide || step === 'done') return;
  draw(src);
  say(text);
  if (!reduceMotion) replay(guideImg, cls || 'hop');
  clearTimeout(asideTimer);
  asideTimer = setTimeout(() => show(step), 2400);
}

if (guide) {
  loadFrames(Object.values(MASCOTS[guide].guide).flat()).then(() => {
    guideEl.hidden = false;
    show(step);
    if (S.mascot === 'choose') {
      say('Who should keep you company?');
      const row = document.createElement('div');
      row.className = 'choose';
      for (const k of mascotKeys) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = MASCOTS[k].label;
        b.addEventListener('click', () => loadFrames(Object.values(MASCOTS[k].guide).flat()).then(() => { guide = k; show(step); }));
        row.appendChild(b);
      }
      bubble.appendChild(row);
    }
  });
  guideImg.addEventListener('animationend', e => { if (e.animationName !== 'breathe') guideImg.classList.remove('hop', 'jump'); });
  if (!reduceMotion) {
    guideEl.classList.add('enter');
    guideEl.addEventListener('animationend', e => { if (e.animationName === 'enter') guideEl.classList.remove('enter'); });
    // blink now and then, when the standing drawing is showing
    (function blink() {
      setTimeout(() => {
        const b = MASCOTS[guide] && MASCOTS[guide].guide.blink;
        if (b && guideImg.getAttribute('src') === b[0]) { draw(b[1]); setTimeout(() => { if (guideImg.getAttribute('src') === b[1]) draw(b[0]); }, 140); }
        blink();
      }, 2500 + Math.random() * 3000);
    })();
  }

  $('#guideFigure').addEventListener('click', () => aside(pick(MASCOTS[guide].guide.tap), pick(LINES.tap), 'jump'));

  // follow along: react to whichever card is in the middle of the screen
  const sections = document.querySelectorAll('.q');
  const sectionWatch = new IntersectionObserver(entries => {
    for (const e of entries) {
      if (!e.isIntersecting || e.target.closest('[hidden]')) continue;
      sections.forEach(s => s.classList.toggle('current', s === e.target));
      if (step !== 'done' && e.target.dataset.step !== step) show(e.target.dataset.step);
    }
  }, { rootMargin: '-42% 0px -42% 0px' });
  sections.forEach(s => sectionWatch.observe(s));

  // step out of the way while someone types on a phone
  document.addEventListener('focusin', e => { if (e.target.matches('textarea,input')) guideEl.classList.add('typing'); });
  document.addEventListener('focusout', () => setTimeout(() => {
    if (!document.activeElement || !document.activeElement.matches('textarea,input')) guideEl.classList.remove('typing');
  }, 150));
}

// =====================================================================
// Sign in: a name is required before the questions appear; email is optional.
// Both are remembered on this phone so people don't type them twice.
// =====================================================================
const VISITOR_KEY = 'beyondTheBadgeVisitor';
let visitor = '', visitorEmail = '';
function remember(who) { if (S.preview) return; try { who ? localStorage.setItem(VISITOR_KEY, JSON.stringify(who)) : localStorage.removeItem(VISITOR_KEY); } catch (e) {} }
function signIn(name, email, quietly) {
  visitor = name;
  visitorEmail = email;
  $('#whoName').textContent = name;
  $('#signin').hidden = true;
  $('#signed').hidden = false;
  $('#form').hidden = false;
  if (!quietly && guide) aside(MASCOTS[guide].guide.hello, `Nice to meet you, ${name.split(/\s+/)[0]}!`);
}
$('#signinForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('#who').value.trim().replace(/\s+/g, ' ');
  const email = $('#whoEmail').value.trim();
  const nameOk = name.length >= 2, emailOk = !email || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  $('#who').setAttribute('aria-invalid', String(!nameOk));
  $('#whoEmail').setAttribute('aria-invalid', String(!emailOk));
  $('#whoError').textContent = !nameOk ? 'Please enter your name to continue.' : !emailOk ? 'That email doesn’t look right. Fix it or leave it blank.' : '';
  if (!nameOk || !emailOk) { (nameOk ? $('#whoEmail') : $('#who')).focus(); return; }
  remember({ name, email });
  signIn(name, email);
  focusFirst();
  $('#signed').scrollIntoView({ block: 'start' });
});
$('#notYou').addEventListener('click', () => {
  remember('');
  visitor = visitorEmail = '';
  $('#who').value = $('#whoEmail').value = '';
  form.reset();
  clearDraft();
  try { localStorage.removeItem(SENT_KEY); } catch (e) {}
  if (!rules.open) return notice('Responses are closed', 'Thank you to everyone who shared!');
  $('#notice').hidden = true;
  $('#signed').hidden = true;
  $('#form').hidden = true;
  $('#finale').hidden = true;
  $('#signin').hidden = false;
  $('#who').focus();
});
let saved = null;
try { saved = S.preview ? null : JSON.parse(localStorage.getItem(VISITOR_KEY) || 'null'); } catch (e) {}
if (saved && saved.name) signIn(saved.name, saved.email || '', true);

// =====================================================================
// Chase scenes between questions
// Each character plays its drawn frames: running loops, the rest play once.
// =====================================================================
const SCALE = 0.35;   // drawing pixels -> screen pixels (a standing officer is about 95px)

function makeActor(lane, look) {
  const el = document.createElement('div'), flip = document.createElement('div'), body = document.createElement('div');
  el.className = 'actor' + (look.fly ? ' fly' : '');
  flip.className = 'flip'; body.className = 'body';
  flip.appendChild(body); el.appendChild(flip); lane.appendChild(el);
  const img = new Image();
  img.alt = ''; body.appendChild(img);
  let timer = null, x = 0;

  const set = src => { img.src = src; img.style.height = (frameHeight[src] || 270) * SCALE + 'px'; };
  const stop = () => clearInterval(timer);
  const a = {
    // loop a set of frames (running, breathing)
    loop(name, fps) {
      stop();
      const list = look.frames[name];
      let i = 0;
      set(list[0]);
      timer = setInterval(() => set(list[++i % list.length]), 1000 / fps);
      return a;
    },
    // show one frame and hold it (index from 0)
    hold(name, i) { stop(); set(look.frames[name][i]); return a; },
    // play frames once, each for `ms`, then hold the last
    async play(name, ms, from = 0, to) {
      stop();
      const list = look.frames[name].slice(from, to);
      for (const src of list) { set(src); await wait(ms); }
      return a;
    },
    place(px) { x = px; el.style.transform = `translateX(${x}px)`; return a; },
    face(dir) { flip.style.setProperty('--dir', dir); return a; },
    move(to, ms, easing = 'linear') {
      const from = x; x = to;
      const anim = el.animate([{ transform: `translateX(${from}px)` }, { transform: `translateX(${to}px)` }], { duration: ms, easing, fill: 'forwards' });
      return anim.finished.then(() => { el.style.transform = `translateX(${to}px)`; anim.cancel(); });
    },
    get x() { return x; },
    puff() {
      if (reduceMotion) return a;
      const d = document.createElement('span'); d.className = 'dust'; d.textContent = '💨';
      el.appendChild(d); setTimeout(() => d.remove(), 650);
      return a;
    },
    // jump in surprise, then flinch
    async startle() { a.hold('startled', 1); replay(body, 'bounce'); await wait(380); a.hold('startled', 2); return a; },
    // the full dive: crouch, leap, fly, belly-flop, crawl, stand. dx = distance, sign = direction
    async dive(dx) {
      await a.play('dive', 110, 1, 3);                       // crouch, push off
      a.hold('dive', 3); await a.move(x + dx * .35, 170);     // leap
      a.hold('dive', 4); await a.move(x + dx * .45, 210);     // fly
      a.hold('dive', 5).puff(); await a.move(x + dx * .2, 260, 'cubic-bezier(.2,.9,.3,1)');   // belly-flop and slide
      await wait(320);
      await a.play('dive', 260, 6, 8);                       // crawl up, stand
      return a;
    },
    remove() { stop(); el.remove(); },
  };
  return a;
}
const person = (lane, key) => makeActor(lane, { frames: MASCOTS[key].frames });
const runaway = lane => {
  const r = makeActor(lane, { frames: runner.frames, fly: runner.fly });
  r.run = () => r.loop('run', 12);
  r.lookBack = () => r.play('look', 170);
  return r;
};

// 1. The dash: it bolts across, an officer chases, dives, misses, catches a breath.
async function sceneDash(lane, a) {
  const w = lane.clientWidth;
  const item = runaway(lane).place(-110).run();
  const cop = person(lane, a).place(-170).loop('run', 14);
  const gone = item.move(w + 60, 2100);
  await wait(400);
  await cop.move(w * .28, 900);
  await cop.dive(120);
  cop.loop('breath', 2.4);
  await wait(1200);
  cop.loop('run', 14);
  await Promise.all([cop.move(w + 100, 1000), gone]);
}

// 2. Doubles back: someone is on watch, it sneaks past, looks back, runs back,
//    and the watcher dives at it as it goes by, misses, and gives chase.
async function sceneDoubleBack(lane, watcherKey) {
  const w = lane.clientWidth, spot = w * .14;
  const watcher = person(lane, watcherKey).place(spot).hold('idle', 0);
  const item = runaway(lane).place(-110).run();
  await item.move(spot + 30, 750);
  watcher.startle();
  await item.move(w - 100, 900);
  await item.lookBack();
  item.face(-1).run();
  const back = item.move(-130, 1500);
  await wait(420);
  await watcher.dive(110);
  watcher.face(-1).loop('run', 14);
  await Promise.all([watcher.move(-200, 1150), back]);
}

// 3. Team chase: both chase, stop for a breath, it peeks back, the chase is back on.
async function sceneTeam(lane, a, b) {
  const w = lane.clientWidth;
  const item = runaway(lane).place(-110).run();
  const gone = item.move(w + 70, 1900);
  const c1 = person(lane, a).place(-170).loop('run', 14);
  const c2 = person(lane, b).place(-300).loop('run', 13);
  await wait(350);
  await Promise.all([c1.move(w * .58, 1300), c2.move(w * .28, 1400)]);
  c1.loop('breath', 2.4); c2.loop('breath', 2.1);
  await gone;
  await wait(450);
  item.face(-1).place(w + 70).run();
  await item.move(w - 110, 450, 'ease-out');
  await item.lookBack();
  c1.startle(); c2.startle();
  await wait(500);
  item.face(1).run();
  const away = item.move(w + 90, 380);
  await wait(220);
  c1.loop('run', 14).puff(); c2.loop('run', 13);
  await Promise.all([c1.move(w + 110, 850), c2.move(w + 140, 1050), away]);
}

const lanes = [...document.querySelectorAll('.lane')];
// The guide leads the chase and an officer partners. Worked out when a scene
// plays, so a guide picked under "let them choose" leads from then on.
const noGuideLead = pick(OFFICERS), partners = {};
function cast() {
  const lead = guide || noGuideLead;
  partners[lead] = partners[lead] || pick(OFFICERS.filter(k => k !== lead));
  return [lead, partners[lead]];
}
const castFrames = () => cast().flatMap(k => Object.values(MASCOTS[k].frames).flat()).concat(Object.values(runner.frames).flat());
const scenes = [
  l => { const [lead] = cast(); return sceneDash(l, lead); },
  l => { const [, partner] = cast(); return sceneDoubleBack(l, partner); },
  l => sceneTeam(l, ...cast()),
];

if (!(S.chase && runner)) {
  // no chase for this theme: a quiet row of its decorations instead
  lanes.forEach(l => {
    if (theme.decor.length) { l.className = 'lane divider'; l.textContent = theme.decor.slice(0, 3).join('   '); }
    else l.className = 'lane rule';
  });
} else {
  if (reduceMotion) {
    // a still picture in place of each scene
    loadFrames(castFrames()).then(() => lanes.forEach((l, i) => {
      person(l, cast()[i === 1 ? 1 : 0]).place(l.clientWidth * .2).hold('idle', 0);
      runaway(l).place(l.clientWidth * .62).hold('run', 0);
    }));
  } else {
    const playing = new Set();
    const play = async (lane, i) => {
      if (playing.has(lane)) return;
      playing.add(lane);
      await loadFrames(castFrames());   // already loaded unless the guide just changed
      if (guide) aside(MASCOTS[guide].guide.call, pick(LINES.chase));
      try { await scenes[i](lane); } finally {
        lane.replaceChildren();
        setTimeout(() => playing.delete(lane), 1500);   // can replay when scrolled back to
      }
    };
    const laneWatch = new IntersectionObserver(entries => {
      for (const e of entries) if (e.isIntersecting) play(e.target, lanes.indexOf(e.target));
    }, { threshold: .9, rootMargin: '0px 0px -130px 0px' });   // above the guide bar, not behind it
    lanes.forEach(l => laneWatch.observe(l));
  }
}

// =====================================================================
// Countdown: date from the link, else the event date saved in Supabase
// =====================================================================
function startCountdown(when) {
  const target = new Date(when).getTime();
  if (isNaN(target)) return;
  const el = $('#countdown');
  const tick = () => {
    const d = target - Date.now();
    el.textContent = d < -864e5 ? ''   // the day after, it goes away
      : d <= 0 ? 'The event is here!'
      : `${Math.floor(d / 864e5)} days · ${Math.floor(d % 864e5 / 36e5)} hours · ${Math.floor(d % 36e5 / 6e4)} minutes to go`;
  };
  tick();
  setInterval(tick, 60000);
}
if (S.date) startCountdown(S.date);
else fetch(SUPABASE + 'event_settings?id=eq.1&select=event_at', { headers: { apikey: KEY } })
  .then(r => r.ok ? r.json() : [])
  .then(([v] = []) => { if (v && v.event_at) startCountdown(v.event_at); })
  .catch(() => {});

// =====================================================================
// Submit
// =====================================================================
const form = $('#form'), message = $('#message');

// One row per response. The first four answers go into the original columns.
// When the questions were edited, each column also gets its question, and
// answers past the fourth are added to the last column, so nothing is lost.
// After supabase/setup.sql has run, the email and every question with its
// answer are saved in their own columns too.
function buildRow() {
  const answers = questions.map((q, i) => ({ question: q, answer: $('#a' + i).value.trim() }));
  const edited = !sameQuestions(questions, QUESTIONS);
  const row = { name: visitor };
  if (visitorEmail) row.email = visitorEmail;
  const text = a => edited ? (a.answer ? `${a.question}\n${a.answer}` : '') : a.answer;
  ANSWER_COLUMNS.forEach((col, i) => {
    const part = i < ANSWER_COLUMNS.length - 1 ? answers.slice(i, i + 1) : answers.slice(i);
    row[col] = part.map(text).filter(Boolean).join('\n\n').slice(0, 3000);   // the column's limit; "answers" keeps it all
  });
  return { row, answers };
}
async function send(row, answers) {
  const post = body => fetch(SUPABASE + 'thanksgiving_responses', {
    method: 'POST',
    headers: { apikey: KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
    body: JSON.stringify(body),
  });
  // Before setup.sql has run there is no email or answers column: leave the
  // missing one out and try again (the email then goes next to the name).
  let body = Object.assign({ answers }, row);
  for (let tries = 0; tries < 3; tries++) {
    const r = await post(body);
    if (r.ok) return;
    const text = r.status === 400 ? await r.text() : '';
    const refused = (text.match(/responses_closed|already_responded|too_many/) || [])[0];
    if (refused) throw new Error(refused);
    const missing = (text.match(/'(email|answers)' column/) || [])[1];
    if (!missing) throw new Error(r.status);
    if (missing === 'email') body.name = `${body.name} (${body.email})`;
    delete body[missing];
  }
  throw new Error('not saved');
}

// =====================================================================
// Response rules, set by organizers and checked again by the database:
// open/closed, and one response per person
// =====================================================================
let rules = { open: true, oneEach: true };
const SENT_KEY = 'beyondTheBadgeSent';
function notice(title, text) {
  $('#noticeTitle').textContent = title;
  $('#noticeText').textContent = text;
  $('#notice').hidden = false;
  $('#signin').hidden = $('#form').hidden = $('#finale').hidden = true;
}
function alreadySent() {
  notice('You’ve already shared your thanks', 'Thank you! There’s one response per person. If this isn’t you, tap “Not you?”.');
}
function sentOnThisPhone() { try { return !S.preview && !!localStorage.getItem(SENT_KEY); } catch (e) { return false; } }
if (!S.preview) fetch(SUPABASE + 'rpc/response_rules', { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: '{}' })
  .then(r => r.ok ? r.json() : null)
  .then(r => {
    if (r) rules = Object.assign(rules, r);
    if (!rules.open) notice('Responses are closed', 'Thank you to everyone who shared!');
    else if (rules.oneEach && visitor && sentOnThisPhone()) alreadySent();
  })
  .catch(() => {});

function finale() {
  const cast$ = $('#finaleCast');
  cast$.replaceChildren();
  const add = src => { const img = new Image(); img.src = src; img.alt = ''; img.style.height = (frameHeight[src] || 230) * .42 + 'px'; cast$.appendChild(img); };
  for (const k of cast()) add(MASCOTS[k].frames.breath[0]);
  if (runner) add(runner.frames.look[3]);
  $('#thanksText').textContent = S.thanks;
  $('#again').hidden = rules.oneEach && !S.preview;
  form.hidden = true;
  $('#finale').hidden = false;
  $('#finale').scrollIntoView({ block: 'center' });
  if (!reduceMotion && theme.decor.length) sprinkle(24, true);
  if (guide) { show('done'); if (!reduceMotion) replay(guideImg, 'jump'); }
}
$('#again').addEventListener('click', () => {
  $('#finale').hidden = true;
  form.hidden = false;
  step = 'ready';
  if (guide) show('ready');
  focusFirst();
});

// Answers are kept on this phone while someone types, so a refresh or a
// closed tab doesn't lose them. Cleared once sent or on "Not you?".
const DRAFT_KEY = 'beyondTheBadgeDraft';
function saveDraft() {
  if (S.preview) return;
  const a = questions.map((_, i) => $('#a' + i).value);
  try { a.some(Boolean) ? localStorage.setItem(DRAFT_KEY, JSON.stringify({ q: questions, a })) : localStorage.removeItem(DRAFT_KEY); } catch (e) {}
}
function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }
form.addEventListener('input', saveDraft);
try {
  const d = S.preview ? null : JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
  if (d && sameQuestions(d.q, questions)) d.a.forEach((v, i) => { $('#a' + i).value = v; });
} catch (e) {}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const { row, answers } = buildRow();
  if (!answers.some(a => a.answer)) { message.textContent = 'Please answer at least one question before submitting.'; return; }
  // the hidden "website" box is only ever filled in by spam robots
  if (S.preview || $('#website').value) { message.textContent = ''; form.reset(); finale(); return; }
  const button = $('#submitBtn');
  button.disabled = true;
  message.textContent = 'Sending…';
  try {
    await send(row, answers);
    message.textContent = '';
    form.reset();
    clearDraft();
    try { localStorage.setItem(SENT_KEY, JSON.stringify({ name: visitor, at: Date.now() })); } catch (e) {}
    finale();
  } catch (err) {
    if (err.message === 'already_responded') { clearDraft(); alreadySent(); return; }
    if (err.message === 'responses_closed') { notice('Responses are closed', 'Thank you to everyone who shared!'); return; }
    message.textContent = err.message === 'too_many'
      ? 'Lots of people are sharing right now. Please wait a minute and try again.'
      : 'Sorry, your response could not be sent. Please try again.';
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
